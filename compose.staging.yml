services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doxary}
      POSTGRES_USER: ${POSTGRES_USER:-doxary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - doxary_postgres:/var/lib/postgresql/data
    networks: [doxary_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: doxary-backend:staging
    restart: unless-stopped
    env_file: [.env]
    environment:
      DOXARY_APP_ENV: production
      DOXARY_DATABASE_URL: ${DOXARY_DATABASE_URL:?set DOXARY_DATABASE_URL}
      DOXARY_TEMPORARY_INPUT_ROOT: /var/lib/doxary/tmp
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "${DOXARY_GUNICORN_WORKERS:-2}", "--access-logfile", "-", "--error-logfile", "-", "app:create_app()"]
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - doxary_temporary:/var/lib/doxary/tmp
    networks: [doxary_internal, doxary_egress]
    depends_on:
      postgres: {condition: service_healthy}
      temporary-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      options: {max-size: "10m", max-file: "3"}

  worker:
    image: doxary-backend:staging
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DOXARY_APP_ENV: production
      DOXARY_DATABASE_URL: ${DOXARY_DATABASE_URL:?set DOXARY_DATABASE_URL}
      DOXARY_TEMPORARY_INPUT_ROOT: /var/lib/doxary/tmp
    command: ["python", "-m", "app.worker"]
    volumes:
      - doxary_temporary:/var/lib/doxary/tmp
    networks: [doxary_internal, doxary_egress]
    depends_on:
      postgres: {condition: service_healthy}
      temporary-init: {condition: service_completed_successfully}
    logging:
      options: {max-size: "10m", max-file: "3"}

  temporary-init:
    image: doxary-backend:staging
    build: .
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "mkdir -p /var/lib/doxary/tmp && chown 100:101 /var/lib/doxary/tmp"]
    volumes:
      - doxary_temporary:/var/lib/doxary/tmp

volumes:
  doxary_postgres:
  doxary_temporary:

networks:
  doxary_internal:
    internal: true
  doxary_egress:
    driver: bridge
